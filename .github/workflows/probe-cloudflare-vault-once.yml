name: Probe Cloudflare credential storage once

on:
  push:
    branches: [main]
    paths:
      - 'ops/cloudflare-vault-probe.trigger'

permissions:
  contents: write
  id-token: write

env:
  DATA_API_URL: https://ep-weathered-cloud-ax67iew3.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
  OIDC_AUDIENCE: neon-boatrace-morning-free

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire short-lived Neon lease
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          jwt="$(jq -er '.value' <<<"$token_response")"
          echo "::add-mask::$jwt"
          curl -sS --fail-with-body -o /tmp/db-lease.json -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H 'Content-Type: application/json' \
            "${DATA_API_URL}/rpc/boatrace_oidc_issue_db_lease" -d '{}'
          database_url="$(jq -er '.database_url' /tmp/db-lease.json)"
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          rm -f /tmp/db-lease.json
      - name: Inspect credential-related schema names only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]'
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row

          sql = """
          SELECT table_schema, table_name, column_name, data_type
          FROM information_schema.columns
          WHERE lower(table_schema || '.' || table_name || '.' || column_name)
                ~ '(cloudflare|oauth|credential|secret|token|vault|wrangler)'
          ORDER BY table_schema, table_name, ordinal_position
          """
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row) as conn:
              conn.execute('SET TRANSACTION READ ONLY')
              rows = [dict(r) for r in conn.execute(sql).fetchall()]
          payload = {
              'schema_version': 'cloudflare-vault-schema-probe-v1',
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'match_count': len(rows),
              'matches': rows,
              'values_read': False,
              'secret_value_recorded': False,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
          }
          Path('ops/cloudflare-vault-schema-probe.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Revoke lease
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${DATABASE_URL:-}" ]; then
            python - <<'PY'
          import os, psycopg
          try:
              with psycopg.connect(os.environ['DATABASE_URL']) as conn:
                  conn.execute('SELECT public.boatrace_revoke_own_db_lease()')
                  conn.commit()
          except Exception as exc:
              print(type(exc).__name__)
          PY
          fi
      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/cloudflare-vault-schema-probe.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/cloudflare-vault-schema-probe.json
          git commit -m 'Record Cloudflare credential-storage schema probe' || exit 0
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
