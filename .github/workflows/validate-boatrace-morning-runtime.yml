name: Validate BOAT RACE Morning runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/boatrace-morning-free.yml'
      - '.github/workflows/validate-boatrace-morning-runtime.yml'
      - 'ops/boatrace-morning-free/runtime/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/boatrace-morning-free.yml'
      - '.github/workflows/validate-boatrace-morning-runtime.yml'
      - 'ops/boatrace-morning-free/runtime/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt
      - name: Install exact dependencies
        run: python -m pip install --requirement ops/boatrace-morning-free/runtime/requirements.txt
      - name: Compile, verify manifest, and run hardening tests
        working-directory: ops/boatrace-morning-free/runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            runner.py \
            production.py \
            audit_overlay.py \
            run_with_digest.py \
            stage_guard.py \
            stage_lock.py \
            delivery_gate.py \
            verify_runtime_manifest.py \
            test_runtime_hardening.py
          python verify_runtime_manifest.py --manifest runtime_manifest.json
          python -m unittest -v test_runtime_hardening.py
