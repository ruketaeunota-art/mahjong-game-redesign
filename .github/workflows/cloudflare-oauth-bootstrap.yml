name: Verify BOAT RACE LINE DB fallback once

on:
  push:
    branches: [main]
    paths:
      - ops/cloudflare-oauth-bootstrap/start.trigger
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: boatrace-line-db-fallback-verification
  cancel-in-progress: false

env:
  DATA_API_URL: https://ep-weathered-cloud-ax67iew3.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
  OIDC_AUDIENCE: neon-boatrace-cloudflare-bootstrap

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire short-lived read lease with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          jwt="$(jq -er '.value' <<<"$token_response")"
          echo "::add-mask::$jwt"
          curl -sS --fail-with-body \
            -o /tmp/db-lease.json \
            -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H 'Content-Type: application/json' \
            "${DATA_API_URL}/rpc/boatrace_oidc_issue_db_lease" \
            -d '{}'
          jq -e '.ok == true and .role == "boatrace_cloudflare_deploy_runner" and (.database_url | type == "string")' /tmp/db-lease.json >/dev/null
          database_url="$(jq -er '.database_url' /tmp/db-lease.json)"
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          rm -f /tmp/db-lease.json

      - name: Install exact database client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.4'

      - name: Verify production DB enrichment and delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row

          result = {
              "schema_version": "boatrace-line-db-fallback-verification-v1",
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "read_only_verification": True,
              "notification_requeued": False,
              "function_exists": False,
              "trigger_exists": False,
              "trigger_enabled": None,
              "latest_skip_audit_event": None,
              "latest_morning_digest": None,
              "db_enrichment_ready": False,
              "delivered_enriched_digest_observed": False,
              "status": "UNKNOWN",
          }

          with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row) as conn:
              conn.execute("SET TRANSACTION READ ONLY")
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT EXISTS (
                      SELECT 1
                      FROM pg_proc p
                      JOIN pg_namespace n ON n.oid=p.pronamespace
                      WHERE n.nspname='ux_app'
                        AND p.proname='enrich_morning_digest_skip_audit_v1'
                    ) AS present
                  """)
                  result["function_exists"] = bool(cur.fetchone()["present"])

                  cur.execute("""
                    SELECT t.tgenabled
                    FROM pg_trigger t
                    WHERE t.tgrelid='ux_app.notification_outbox'::regclass
                      AND t.tgname='morning_digest_skip_audit_enrichment'
                      AND NOT t.tgisinternal
                    LIMIT 1
                  """)
                  trigger = cur.fetchone()
                  result["trigger_exists"] = trigger is not None
                  result["trigger_enabled"] = None if trigger is None else trigger["tgenabled"]

                  cur.execute("""
                    SELECT
                      r.id AS run_execution_id,
                      r.target_date::text AS target_date,
                      r.stage,
                      e.event_seq,
                      e.lifecycle_status,
                      e.outcome,
                      e.actionable_count,
                      e.s_count,
                      e.a_count,
                      e.details->>'skip_audit_version' AS skip_audit_version,
                      COALESCE((e.details->>'skip_audit_count')::integer, 0) AS skip_audit_count
                    FROM ux_app.run_executions r
                    JOIN LATERAL (
                      SELECT x.*
                      FROM ux_app.run_events x
                      WHERE x.run_execution_id=r.id
                      ORDER BY x.event_seq DESC
                      LIMIT 1
                    ) e ON true
                    WHERE e.details->>'skip_audit_version'='morning-skip-audit-v1'
                    ORDER BY r.id DESC
                    LIMIT 1
                  """)
                  event = cur.fetchone()
                  if event is not None:
                      result["latest_skip_audit_event"] = dict(event)

                  cur.execute("""
                    SELECT
                      o.id,
                      o.run_execution_id,
                      o.status,
                      o.created_at::text AS created_at,
                      o.accepted_at::text AS accepted_at,
                      (o.provider_message_id IS NOT NULL) AS provider_message_id_present,
                      o.payload->>'presentation' AS presentation,
                      o.payload->>'ui_version' AS ui_version,
                      o.payload->>'skip_audit_version' AS skip_audit_version,
                      COALESCE(jsonb_array_length(
                        CASE WHEN jsonb_typeof(o.payload->'skip_summary_lines')='array'
                             THEN o.payload->'skip_summary_lines'
                             ELSE '[]'::jsonb END
                      ),0) AS skip_summary_line_count,
                      POSITION('見送り内訳' IN COALESCE(o.payload->>'canonical_text','')) > 0 AS canonical_has_skip_breakdown,
                      POSITION('実オッズEVはこの通知では未評価' IN COALESCE(o.payload->>'canonical_text','')) > 0 AS canonical_has_ev_disclaimer
                    FROM ux_app.notification_outbox o
                    WHERE o.event_kind='MORNING_DIGEST'
                    ORDER BY o.id DESC
                    LIMIT 1
                  """)
                  digest = cur.fetchone()
                  if digest is not None:
                      result["latest_morning_digest"] = dict(digest)

          result["db_enrichment_ready"] = bool(
              result["function_exists"]
              and result["trigger_exists"]
              and result["trigger_enabled"] in ("O", "A")
          )
          digest = result["latest_morning_digest"] or {}
          result["delivered_enriched_digest_observed"] = bool(
              digest.get("presentation") == "MORNING_CARD_V2"
              and digest.get("canonical_has_skip_breakdown")
              and digest.get("canonical_has_ev_disclaimer")
              and digest.get("status") in ("SENT", "DELIVERED", "ACCEPTED")
          )
          if result["delivered_enriched_digest_observed"]:
              result["status"] = "PASS_DELIVERED"
          elif result["db_enrichment_ready"]:
              result["status"] = "READY_NEXT_DIGEST"
          else:
              result["status"] = "BLOCKED"

          Path("evidence/boatrace-line-db-fallback-verification.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Persist sanitized verification evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f ops/cloudflare-oauth-bootstrap/device-session.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A evidence/boatrace-line-db-fallback-verification.json ops/cloudflare-oauth-bootstrap
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record BOAT RACE LINE DB fallback verification'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 90

      - name: Revoke short-lived database lease
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${DATABASE_URL:-}" ]; then
            python - <<'PY'
          import os
          import psycopg
          try:
              with psycopg.connect(os.environ['DATABASE_URL']) as conn:
                  with conn.cursor() as cur:
                      cur.execute('SELECT public.boatrace_revoke_own_db_lease()')
                      cur.fetchone()
                  conn.commit()
          except Exception as exc:
              print(f'lease revoke warning: {type(exc).__name__}')
          PY
          fi
          exit 0
