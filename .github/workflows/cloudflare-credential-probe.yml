name: Probe existing Cloudflare CI credential

on:
  push:
    branches:
      - ops/cloudflare-credential-probe-20260825
    paths:
      - ops/cloudflare-credential-probe/trigger.txt

permissions:
  contents: write

concurrency:
  group: cloudflare-credential-probe-20260825
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_CF: ${{ secrets.CF_API_TOKEN }}
      TOKEN_ALT: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_WRANGLER: ${{ secrets.WRANGLER_API_TOKEN }}
      ACCOUNT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_CF: ${{ secrets.CF_ACCOUNT_ID }}
      ACCOUNT_ALT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
      EXPECTED_ACCOUNT_ID: 0b518be7b875d0556c0ebab83cc50e0c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Probe without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          token=''
          source='none'
          for candidate in TOKEN_PRIMARY TOKEN_CF TOKEN_ALT TOKEN_WRANGLER; do
            value="${!candidate:-}"
            if [ -n "$value" ]; then
              token="$value"
              source="$candidate"
              break
            fi
          done
          account_source='hardcoded'
          account="$EXPECTED_ACCOUNT_ID"
          for candidate in ACCOUNT_PRIMARY ACCOUNT_CF ACCOUNT_ALT; do
            value="${!candidate:-}"
            if [ -n "$value" ]; then
              account="$value"
              account_source="$candidate"
              break
            fi
          done
          verify_http=0
          verify_success=false
          account_http=0
          account_success=false
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            verify_http="$(curl -sS --max-time 20 -o /tmp/token-verify.json -w '%{http_code}' -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
            if jq -e '.success == true' /tmp/token-verify.json >/dev/null 2>&1; then verify_success=true; fi
            account_http="$(curl -sS --max-time 20 -o /tmp/account.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID" || true)"
            if jq -e '.success == true and .result.id == env.EXPECTED_ACCOUNT_ID' /tmp/account.json >/dev/null 2>&1; then account_success=true; fi
          fi
          mkdir -p ops/cloudflare-credential-probe
          TOKEN_PRESENT="$([ -n "$token" ] && echo true || echo false)" \
          TOKEN_SOURCE="$source" ACCOUNT_SOURCE="$account_source" ACCOUNT_MATCH="$([ "$account" = "$EXPECTED_ACCOUNT_ID" ] && echo true || echo false)" \
          VERIFY_HTTP="$verify_http" VERIFY_SUCCESS="$verify_success" ACCOUNT_HTTP="$account_http" ACCOUNT_SUCCESS="$account_success" \
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data = {
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'token_present': os.environ['TOKEN_PRESENT'] == 'true',
              'token_source': os.environ['TOKEN_SOURCE'],
              'configured_account_source': os.environ['ACCOUNT_SOURCE'],
              'configured_account_matches_expected': os.environ['ACCOUNT_MATCH'] == 'true',
              'token_verify_http': int(os.environ['VERIFY_HTTP'] or 0),
              'token_verify_success': os.environ['VERIFY_SUCCESS'] == 'true',
              'expected_account_http': int(os.environ['ACCOUNT_HTTP'] or 0),
              'expected_account_access_success': os.environ['ACCOUNT_SUCCESS'] == 'true',
              'secrets_exposed': False,
          }
          Path('ops/cloudflare-credential-probe/result.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          rm -f /tmp/token-verify.json /tmp/account.json
      - name: Record probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/cloudflare-credential-probe/result.json
          git commit -m 'Record Cloudflare credential probe result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
