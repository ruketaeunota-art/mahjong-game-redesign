name: Validate complete Morning runtime branch once

on:
  push:
    branches: [agent/morning-production-hardening-20260825]
    paths:
      - ops/boatrace-morning-free/runtime/manifest.trigger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/morning-production-hardening-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt
      - name: Install exact dependencies
        run: python -m pip install --requirement ops/boatrace-morning-free/runtime/requirements.txt
      - name: Compile, verify manifest, run tests, and inspect workflow contract
        shell: bash
        run: |
          set -euo pipefail
          cd ops/boatrace-morning-free/runtime
          python -m py_compile \
            runner.py \
            production.py \
            audit_overlay.py \
            run_with_digest.py \
            stage_guard.py \
            stage_lock.py \
            delivery_gate.py \
            verify_runtime_manifest.py \
            test_runtime_hardening.py
          python verify_runtime_manifest.py --manifest runtime_manifest.json
          python -m unittest -v test_runtime_hardening.py
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/boatrace-morning-free.yml').read_text(encoding='utf-8')
          required = [
              "cron: '0 22 * * *'",
              "cron: '30 23 * * *'",
              "ops/boatrace-morning-free/recovery.trigger",
              'stage_lock.py',
              'delivery_gate.py',
              'verify_runtime_manifest.py',
              'SKIPPED_ALREADY_STARTED_DELIVERY_VERIFIED',
              'PASS_DELIVERED',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'missing workflow contract markers: {missing}')
          forbidden = [
              "'ops/boatrace-morning-free/runtime/**'",
              'wrangler login',
              'oauth2/device',
          ]
          present = [item for item in forbidden if item in workflow]
          if present:
              raise SystemExit(f'forbidden workflow markers: {present}')
          print('workflow contract: PASS')
          PY
