name: Verify Morning skip-audit runtime once

on:
  push:
    branches: [main]
    paths:
      - ops/boatrace-morning-free/enable-skip-audit.trigger

permissions:
  contents: read

concurrency:
  group: verify-morning-skip-audit-runtime
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -r ops/boatrace-morning-free/runtime/requirements.txt

      - name: Verify syntax and overlay binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'import audit_overlay  # noqa: F401  # installs skip-audit persistence overlay' \
            ops/boatrace-morning-free/runtime/run_with_digest.py
          grep -Fq "'skip_audit_version': 'morning-skip-audit-v1'" \
            ops/boatrace-morning-free/runtime/audit_overlay.py
          python -m py_compile \
            ops/boatrace-morning-free/runtime/runner.py \
            ops/boatrace-morning-free/runtime/production.py \
            ops/boatrace-morning-free/runtime/audit_overlay.py \
            ops/boatrace-morning-free/runtime/run_with_digest.py
          (
            cd ops/boatrace-morning-free/runtime
            python - <<'PY'
          import run_with_digest
          assert run_with_digest._original_persist.__name__ == 'persist_with_skip_audit'
          assert run_with_digest.runner.persist.__name__ == 'persist_with_digest'
          print('skip-audit overlay binding: PASS')
          PY
          )
