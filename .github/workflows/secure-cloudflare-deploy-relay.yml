name: Secure Cloudflare production relay

on:
  push:
    branches: [ops/cloudflare-secure-relay-20260826]
    paths:
      - '_relay/trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: secure-cloudflare-production-relay
  cancel-in-progress: false

env:
  ISSUE_NUMBER: '3'
  MANIFEST_SHA256: '35cb91d2f049d7f7da5263b7799283ba86592b2a4a44202825877770b58c3514'
  CLOUDFLARE_ACCOUNT_ID: '0b518be7b875d0556c0ebab83cc50e0c'
  WORKER_NAME: 'boatrace-line-free'
  EXPECTED_SERVICE_VERSION: '0.2.6-skip-audit-v1-deploy-hardening'
  HEALTH_URL: 'https://boatrace-line-free.ruketaeunota.workers.dev/health'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout encrypted relay material
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Establish ephemeral key exchange
        id: relay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/secure-relay"
          mkdir -p "$work"
          private_key="$work/private.pem"
          public_key="$work/public.pem"
          encrypted_key="$work/relay-key.enc"
          relay_key="$work/relay.key"

          post_comment() {
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="$1" >/dev/null
          }

          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          public_b64="$(base64 -w 0 "$public_key")"
          post_comment "RELAY_PUBLIC_KEY_V1:${public_b64}"

          relay_cipher=""
          for _ in $(seq 1 210); do
            relay_cipher="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
                | jq -r '[.[] | .body | select(startswith("RELAY_KEY_CIPHERTEXT_V1:")) | sub("^RELAY_KEY_CIPHERTEXT_V1:"; "")] | last // empty'
            )"
            if [ -n "$relay_cipher" ]; then break; fi
            sleep 2
          done
          if [ -z "$relay_cipher" ] || ! [[ "$relay_cipher" =~ ^[A-Za-z0-9+/=]+$ ]]; then
            post_comment 'RELAY_RESULT_V1:FAILED:ENCRYPTED_KEY_TIMEOUT'
            exit 31
          fi

          printf '%s' "$relay_cipher" | base64 -d > "$encrypted_key"
          openssl pkeyutl -decrypt \
            -inkey "$private_key" \
            -in "$encrypted_key" \
            -out "$relay_key" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          if ! [[ "$(cat "$relay_key")" =~ ^[a-f0-9]{64}$ ]]; then
            post_comment 'RELAY_RESULT_V1:FAILED:INVALID_RELAY_KEY'
            exit 32
          fi
          echo "work=$work" >> "$GITHUB_OUTPUT"
          echo "relay_key=$relay_key" >> "$GITHUB_OUTPUT"
          echo "Ephemeral relay key accepted."

      - name: Decrypt manifest and reconstruct private source
        shell: bash
        env:
          RELAY_WORK: ${{ steps.relay.outputs.work }}
          RELAY_KEY_FILE: ${{ steps.relay.outputs.relay_key }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p worker
          base64 -d _relay/source-manifest.enc.b64 > "$RELAY_WORK/source-manifest.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RELAY_WORK/source-manifest.enc" \
            -out "$RELAY_WORK/source-manifest.json" \
            -pass file:"$RELAY_KEY_FILE"
          actual_manifest_sha="$(sha256sum "$RELAY_WORK/source-manifest.json" | awk '{print $1}')"
          [ "$actual_manifest_sha" = "$MANIFEST_SHA256" ]

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          root = pathlib.Path('worker').resolve()
          manifest = json.loads(pathlib.Path(os.environ['RELAY_WORK'], 'source-manifest.json').read_text())
          if manifest.get('schema_version') != 'boatrace-cloudflare-secure-source-manifest-v1':
              raise SystemExit('INVALID_SOURCE_MANIFEST')
          for entry in manifest.get('files', []):
              rel = pathlib.PurePosixPath(entry['path'])
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit('INVALID_SOURCE_PATH')
              target = root.joinpath(*rel.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(entry['url'], headers={'User-Agent': 'boatrace-secure-deploy-relay/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()
              except Exception as exc:
                  raise SystemExit(f'DOWNLOAD_FAILED:{rel}:{type(exc).__name__}') from None
              git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if git_blob != entry['git_blob_sha']:
                  raise SystemExit(f'GIT_BLOB_MISMATCH:{rel}')
              target.write_bytes(data)
          print(json.dumps({'downloaded_files': len(manifest['files']), 'source_commit': manifest['source_commit']}))
          PY

          grep -Fq 'MORNING_CARD_V2' worker/src/morning-digest.ts
          grep -Fq 'skip_summary_lines' worker/src/morning-digest.ts
          grep -Fq '0.2.6-skip-audit-v1-deploy-hardening' worker/wrangler.jsonc
          if find worker -type f \( -name '*.env' -o -name '.dev.vars' -o -name '*.pem' \) | grep -q .; then
            echo 'Secret-like file unexpectedly present in relay source.'
            exit 33
          fi

      - name: Install exact dependencies and build dist
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir=dist --config wrangler.jsonc
          test -s dist/index.js
          grep -Fq 'MORNING_CARD_V2' src/morning-digest.ts

      - name: Authorize Cloudflare with short-lived device flow
        id: cloudflare_login
        working-directory: worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          login_log="$RUNNER_TEMP/wrangler-device-login.log"
          : > "$login_log"
          set +e
          stdbuf -oL -eL npx wrangler login --device --browser=false --no-use-keyring \
            > >(tee "$login_log") 2>&1 &
          login_pid=$!
          set -e

          device_code=""
          for _ in $(seq 1 120); do
            device_code="$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "$login_log" | tail -n 1 || true)"
            if [ -n "$device_code" ]; then break; fi
            if ! kill -0 "$login_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [ -z "$device_code" ]; then
            wait "$login_pid" || true
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body='RELAY_RESULT_V1:FAILED:DEVICE_CODE_NOT_EMITTED' >/dev/null
            exit 34
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="CLOUDFLARE_DEVICE_V1:${device_code}" >/dev/null

          if ! wait "$login_pid"; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body='RELAY_RESULT_V1:FAILED:CLOUDFLARE_DEVICE_AUTH' >/dev/null
            exit 35
          fi
          npx wrangler whoami >/dev/null
          echo 'Cloudflare device authorization completed.'

      - name: Deploy verified dist to production
        id: production
        working-directory: worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          npx wrangler deploy dist/index.js \
            --config wrangler.jsonc \
            --no-bundle \
            --keep-vars \
            --strict \
            --message 'Deploy Morning CARD V2 skip-detail production renderer' \
            2>&1 | tee "$deploy_log"

          health=''
          for _ in $(seq 1 15); do
            if health="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL")"; then
              service_version="$(jq -r '.serviceVersion // empty' <<<"$health")"
              if [ "$service_version" = "$EXPECTED_SERVICE_VERSION" ]; then break; fi
            fi
            sleep 2
          done
          service_version="$(jq -r '.serviceVersion // empty' <<<"$health")"
          [ "$service_version" = "$EXPECTED_SERVICE_VERSION" ]
          service_name="$(jq -r '.service // .serviceName // empty' <<<"$health")"

          version_json="$(npx wrangler versions list --name "$WORKER_NAME" --json)"
          version_id="$(jq -r '.[0].id // .[0].version_id // empty' <<<"$version_json")"
          if [ -z "$version_id" ]; then
            version_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$deploy_log" | tail -n 1 || true)"
          fi

          body="RELAY_RESULT_V1:PASS\nworker=${WORKER_NAME}\nservice_version=${service_version}\nservice_name=${service_name}\nversion_id=${version_id:-unknown}\nsource_manifest_sha256=${MANIFEST_SHA256}\nworkflow_run_id=${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$body" >/dev/null

      - name: Remove decrypted material
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf worker "$RUNNER_TEMP/secure-relay" "$HOME/.wrangler" "$HOME/.config/.wrangler"
