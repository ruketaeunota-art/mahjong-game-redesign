name: Probe V2 Flex delivery credentials once

on:
  push:
    branches: [ops/v2-flex-priority-20260826]
    paths:
      - 'ops/v2-flex-priority/probe.trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET: ${{ secrets.LINE_TARGET_USER_ID }}
      DB_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/v2-flex-priority-20260826
      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/v2-flex-priority
          has() { if [ -n "$1" ]; then printf true; else printf false; fi; }
          cat > ops/v2-flex-priority/secret-presence.json <<EOF
          {
            "schema_version": "v2-flex-secret-presence-v1",
            "cloudflare_api_token_present": $(has "${CF_TOKEN:-}"),
            "line_channel_access_token_present": $(has "${LINE_TOKEN:-}"),
            "line_target_user_id_present": $(has "${LINE_TARGET:-}"),
            "database_url_present": $(has "${DB_URL:-}"),
            "secret_values_recorded": false,
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          EOF
      - name: Persist sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/v2-flex-priority/secret-presence.json
          git commit -m 'Record V2 Flex credential presence' || exit 0
          git push origin HEAD:ops/v2-flex-priority-20260826
