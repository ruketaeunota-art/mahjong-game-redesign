name: Validate BOAT RACE Morning Free Runtime

on:
  push:
    branches:
      - agent/boatrace-public-free-runtime-20260824
    paths:
      - '.github/workflows/boatrace-morning-free-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boatrace-public-free-runtime-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt

      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r ops/boatrace-morning-free/runtime/requirements.txt

      - name: Compile and import production runtime
        shell: bash
        run: |
          set -euo pipefail
          cd ops/boatrace-morning-free/runtime
          python -m py_compile runner.py production.py run_with_digest.py
          python - <<'PY'
          import production
          import run_with_digest
          import runner
          assert runner.SOURCE_REF == 'github-spec-rebuild:v2.1-frozen-neon-20260818'
          assert runner.score_race is production.corrected_score_race
          assert runner.persist is run_with_digest.persist_with_digest
          print('PUBLIC_RUNTIME_VALIDATION_PASS')
          PY

      - name: Record validation result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/boatrace-morning-free
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result = {
              'schema_version': 'boatrace-public-runtime-validation-v1',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'overall': 'PASS',
              'python': '3.12',
              'compile': 'PASS',
              'import_overlay': 'PASS',
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_commit_sha': os.environ.get('GITHUB_SHA'),
          }
          Path('ops/boatrace-morning-free/runtime-validation.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/boatrace-morning-free/runtime-validation.json
          git commit -m 'Record BOAT RACE public runtime validation PASS'
          git push origin HEAD:agent/boatrace-public-free-runtime-20260824
