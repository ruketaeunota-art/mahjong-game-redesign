name: BOAT RACE Morning Free Production

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 JST EARLY
    - cron: '30 23 * * *'  # 08:30 JST LATE
  push:
    branches: [main]
    paths:
      - '.github/workflows/boatrace-morning-free.yml'
      - 'ops/boatrace-morning-free/runtime/**'
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD JST
        required: false
        type: string
      stage:
        description: EARLY or LATE
        required: false
        type: choice
        options: [EARLY, LATE]
      force_replay:
        description: Allow a replay after an existing successful stage
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: boatrace-morning-free-production
  cancel-in-progress: false

env:
  DATA_API_URL: https://ep-weathered-cloud-ax67iew3.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
  OIDC_AUDIENCE: neon-boatrace-morning-free
  RUNTIME_DIR: ops/boatrace-morning-free/runtime
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact production runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt

      - name: Resolve target date and stage
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_FORCE_REPLAY: ${{ inputs.force_replay }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          target="${INPUT_DATE:-}"
          stage="${INPUT_STAGE:-}"
          force_replay="${INPUT_FORCE_REPLAY:-false}"
          if [ -z "$target" ]; then target="$(TZ=Asia/Tokyo date +%F)"; fi
          if [ -z "$stage" ]; then
            case "${EVENT_SCHEDULE:-}" in
              '30 23 * * *') stage=LATE ;;
              *) stage=EARLY ;;
            esac
          fi
          [[ "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$stage" = EARLY || "$stage" = LATE ]]
          [[ "$force_replay" = true || "$force_replay" = false ]]
          echo "TARGET_DATE=$target" >> "$GITHUB_ENV"
          echo "MORNING_STAGE=$stage" >> "$GITHUB_ENV"
          echo "FORCE_REPLAY=$force_replay" >> "$GITHUB_ENV"
          echo "EVENT_SCHEDULE=${EVENT_SCHEDULE:-}" >> "$GITHUB_ENV"

      - name: Acquire short-lived Neon database lease with GitHub OIDC
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          jwt="$(jq -er '.value' <<<"$token_response")"
          echo "::add-mask::$jwt"
          curl -sS --fail-with-body \
            -o /tmp/db-lease.json \
            -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H 'Content-Type: application/json' \
            "${DATA_API_URL}/rpc/boatrace_oidc_issue_db_lease" \
            -d '{}'
          jq -e '.ok == true and (.database_url | type == "string")' /tmp/db-lease.json >/dev/null
          database_url="$(jq -er '.database_url' /tmp/db-lease.json)"
          expires_at="$(jq -er '.expires_at' /tmp/db-lease.json)"
          password="$(DATABASE_URL_VALUE="$database_url" python - <<'PY'
          import os
          from urllib.parse import urlparse
          print(urlparse(os.environ['DATABASE_URL_VALUE']).password or '')
          PY
          )"
          echo "::add-mask::$database_url"
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          rm -f /tmp/db-lease.json

      - name: Install exact production dependencies
        run: python -m pip install --requirement "$RUNTIME_DIR/requirements.txt"

      - name: Execute one locked Morning run and verify LINE acceptance
        id: run
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/boatrace-morning-production.log"
          LOCK_READY="$RUNNER_TEMP/morning-stage-lock-ready.json"
          LOCK_RELEASE="$RUNNER_TEMP/morning-stage-lock-release"
          DELIVERY_EVIDENCE="$GITHUB_WORKSPACE/ops/boatrace-morning-free/delivery-latest.json"
          mkdir -p "$GITHUB_WORKSPACE/ops/boatrace-morning-free"
          rm -f "$LOCK_READY" "$LOCK_RELEASE" "$DELIVERY_EVIDENCE"

          CODE=0
          SKIPPED=false
          DISPOSITION=EXECUTED
          RUN_ID=""
          EXPECTED_SKIP_COUNT=""
          LOCK_PID=""

          cleanup_lock() {
            touch "$LOCK_RELEASE" 2>/dev/null || true
            if [ -n "${LOCK_PID:-}" ]; then
              wait "$LOCK_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_lock EXIT

          python "$RUNTIME_DIR/stage_lock.py" \
            --target-date "$TARGET_DATE" \
            --stage "$MORNING_STAGE" \
            --ready-file "$LOCK_READY" \
            --release-file "$LOCK_RELEASE" \
            --timeout-seconds 2100 \
            > "$RUNNER_TEMP/morning-stage-lock.log" 2>&1 &
          LOCK_PID=$!

          for _ in $(seq 1 120); do
            [ -s "$LOCK_READY" ] && break
            sleep 0.25
          done

          if [ ! -s "$LOCK_READY" ]; then
            CODE=21
            DISPOSITION=LOCK_START_TIMEOUT
          else
            LOCK_STATUS="$(jq -r '.status' "$LOCK_READY")"
            case "$LOCK_STATUS" in
              LOCK_BUSY)
                SKIPPED=true
                DISPOSITION=SKIPPED_STAGE_LOCKED
                ;;
              LOCK_ACQUIRED)
                ;;
              *)
                CODE=22
                DISPOSITION=LOCK_ERROR
                ;;
            esac
          fi

          if [ "$CODE" -eq 0 ] && [ "$SKIPPED" = false ]; then
            set +e
            (
              cd "$RUNTIME_DIR"
              python -m py_compile \
                runner.py \
                production.py \
                audit_overlay.py \
                run_with_digest.py \
                stage_guard.py \
                stage_lock.py \
                delivery_gate.py \
                verify_runtime_manifest.py && \
              python verify_runtime_manifest.py --manifest runtime_manifest.json
            ) > "$LOG" 2>&1
            CODE=$?
            set -e
            if [ "$CODE" -ne 0 ]; then DISPOSITION=RUNTIME_VALIDATION_FAILED; fi
          fi

          if [ "$CODE" -eq 0 ] && [ "$SKIPPED" = false ] && [ "$FORCE_REPLAY" != true ]; then
            set +e
            python "$RUNTIME_DIR/stage_guard.py" \
              --target-date "$TARGET_DATE" \
              --stage "$MORNING_STAGE" >> "$LOG" 2>&1
            GUARD_CODE=$?
            set -e
            if [ "$GUARD_CODE" -eq 10 ]; then
              SKIPPED=true
              DISPOSITION=SKIPPED_ALREADY_STARTED
            elif [ "$GUARD_CODE" -ne 0 ]; then
              CODE=$GUARD_CODE
              DISPOSITION=STAGE_GUARD_FAILED
            fi
          fi

          if [ "$CODE" -eq 0 ] && [ "$SKIPPED" = false ]; then
            set +e
            (
              cd "$RUNTIME_DIR"
              python run_with_digest.py \
                --target-date "$TARGET_DATE" \
                --stage "$MORNING_STAGE"
            ) >> "$LOG" 2>&1
            CODE=$?
            set -e
            if [ "$CODE" -ne 0 ]; then DISPOSITION=MORNING_RUN_FAILED; fi
          fi

          if [ "$CODE" -eq 0 ] && [ "$SKIPPED" = false ]; then
            set +e
            python - "$LOG" > "$RUNNER_TEMP/morning-run-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          for line in reversed(Path(sys.argv[1]).read_text(errors='replace').splitlines()):
              try:
                  value = json.loads(line)
              except Exception:
                  continue
              if isinstance(value, dict) and isinstance(value.get('run_id'), int) and isinstance(value.get('result'), dict):
                  result = value['result']
                  actionable = int(result.get('actionable', 0))
                  s_count = int(result.get('s', 0))
                  a_count = int(result.get('a', 0))
                  skip_count = actionable - s_count - a_count
                  if skip_count < 0:
                      raise SystemExit(2)
                  print(json.dumps({'run_id': value['run_id'], 'expected_skip_count': skip_count}))
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            PARSE_CODE=$?
            set -e
            if [ "$PARSE_CODE" -ne 0 ]; then
              CODE=23
              DISPOSITION=RUN_RESULT_PARSE_FAILED
            else
              RUN_ID="$(jq -r '.run_id' "$RUNNER_TEMP/morning-run-result.json")"
              EXPECTED_SKIP_COUNT="$(jq -r '.expected_skip_count' "$RUNNER_TEMP/morning-run-result.json")"
            fi
          fi

          if [ "$CODE" -eq 0 ] && [ "$SKIPPED" = false ]; then
            set +e
            python "$RUNTIME_DIR/delivery_gate.py" \
              --run-id "$RUN_ID" \
              --expected-skip-count "$EXPECTED_SKIP_COUNT" \
              --evidence-file "$DELIVERY_EVIDENCE" \
              --timeout-seconds 150 \
              --poll-seconds 2 >> "$LOG" 2>&1
            DELIVERY_CODE=$?
            set -e
            if [ "$DELIVERY_CODE" -ne 0 ]; then
              CODE=$DELIVERY_CODE
              DISPOSITION=DELIVERY_GATE_FAILED
            else
              DISPOSITION=PASS_DELIVERED
            fi
          fi

          cleanup_lock
          trap - EXIT

          export CODE SKIPPED DISPOSITION LOG RUN_ID EXPECTED_SKIP_COUNT LOCK_READY DELIVERY_EVIDENCE
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ['LOG'])
          text = log_path.read_text(errors='replace') if log_path.exists() else ''
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '[REDACTED_DATABASE_URL]', text)
          lock_path = Path(os.environ['LOCK_READY'])
          delivery_path = Path(os.environ['DELIVERY_EVIDENCE'])
          payload = {
              'schema_version': 'boatrace-public-free-production-run-v3',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'target_date': os.environ['TARGET_DATE'],
              'stage': os.environ['MORNING_STAGE'],
              'exit_code': int(os.environ['CODE']),
              'success': int(os.environ['CODE']) == 0,
              'skipped': os.environ['SKIPPED'] == 'true',
              'disposition': os.environ['DISPOSITION'],
              'force_replay': os.environ.get('FORCE_REPLAY') == 'true',
              'run_execution_id': int(os.environ['RUN_ID']) if os.environ.get('RUN_ID') else None,
              'expected_skip_count': int(os.environ['EXPECTED_SKIP_COUNT']) if os.environ.get('EXPECTED_SKIP_COUNT') else None,
              'stage_lock': json.loads(lock_path.read_text()) if lock_path.is_file() else None,
              'delivery_gate': json.loads(delivery_path.read_text()) if delivery_path.is_file() else None,
              'runtime_contract_version': 'morning-prod-hardening-20260825-001',
              'event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'event_schedule': os.environ.get('EVENT_SCHEDULE') or None,
              'source_commit_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'lease_expires_at': os.environ.get('LEASE_EXPIRES_AT'),
              'database_secret_stored': False,
              'automatic_purchase': False,
              'log_tail': text[-6000:],
          }
          Path('ops/boatrace-morning-free/last-run.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "disposition=$DISPOSITION" >> "$GITHUB_OUTPUT"
          tail -n 160 "$LOG" || true
          exit 0
        env:
          LEASE_EXPIRES_AT: ${{ steps.lease.outputs.expires_at }}

      - name: Persist sanitized production evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f ops/boatrace-morning-free/last-run.json ]; then
            git add ops/boatrace-morning-free/last-run.json
          fi
          if [ -f ops/boatrace-morning-free/delivery-latest.json ]; then
            git add ops/boatrace-morning-free/delivery-latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record BOAT RACE Morning ${TARGET_DATE} ${MORNING_STAGE} production"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
          done
          exit 70

      - name: Revoke short-lived database lease
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${DATABASE_URL:-}" ]; then
            python - <<'PY'
          import os
          import psycopg
          try:
              with psycopg.connect(os.environ['DATABASE_URL']) as conn:
                  with conn.cursor() as cur:
                      cur.execute('SELECT public.boatrace_revoke_own_db_lease()')
                      cur.fetchone()
                  conn.commit()
          except Exception as exc:
              print(f'lease revoke warning: {type(exc).__name__}')
          PY
          fi
          exit 0

      - name: Enforce production result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          [ "${EXIT_CODE:-99}" = 0 ]
