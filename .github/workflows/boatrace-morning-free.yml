name: BOAT RACE Morning Free Production

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 JST EARLY
    - cron: '30 23 * * *'  # 08:30 JST LATE
  push:
    branches: [main]
    paths:
      - '.github/workflows/boatrace-morning-free.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: YYYY-MM-DD JST
        required: false
        type: string
      stage:
        description: EARLY or LATE
        required: false
        type: choice
        options: [EARLY, LATE]

permissions:
  contents: write
  id-token: write

concurrency:
  group: boatrace-morning-free-production
  cancel-in-progress: false

env:
  DATA_API_URL: https://ep-weathered-cloud-ax67iew3.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
  OIDC_AUDIENCE: neon-boatrace-morning-free
  RUNTIME_DIR: ops/boatrace-morning-free/runtime

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout production runtime
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/boatrace-morning-free/runtime/requirements.txt

      - name: Resolve target date and stage
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_STAGE: ${{ inputs.stage }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          target="${INPUT_DATE:-}"
          stage="${INPUT_STAGE:-}"
          if [ -z "$target" ]; then target="$(TZ=Asia/Tokyo date +%F)"; fi
          if [ -z "$stage" ]; then
            case "${EVENT_SCHEDULE:-}" in
              '30 23 * * *') stage=LATE ;;
              *) stage=EARLY ;;
            esac
          fi
          [[ "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$stage" = EARLY || "$stage" = LATE ]]
          echo "TARGET_DATE=$target" >> "$GITHUB_ENV"
          echo "MORNING_STAGE=$stage" >> "$GITHUB_ENV"
          echo "EVENT_SCHEDULE=${EVENT_SCHEDULE:-}" >> "$GITHUB_ENV"

      - name: Acquire short-lived Neon database lease with GitHub OIDC
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          jwt="$(jq -er '.value' <<<"$token_response")"
          echo "::add-mask::$jwt"
          curl -sS --fail-with-body \
            -o /tmp/db-lease.json \
            -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H 'Content-Type: application/json' \
            "${DATA_API_URL}/rpc/boatrace_oidc_issue_db_lease" \
            -d '{}'
          jq -e '.ok == true and (.database_url | type == "string")' /tmp/db-lease.json >/dev/null
          database_url="$(jq -er '.database_url' /tmp/db-lease.json)"
          expires_at="$(jq -er '.expires_at' /tmp/db-lease.json)"
          password="$(DATABASE_URL_VALUE="$database_url" python - <<'PY'
          import os
          from urllib.parse import urlparse
          print(urlparse(os.environ['DATABASE_URL_VALUE']).password or '')
          PY
          )"
          echo "::add-mask::$database_url"
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          rm -f /tmp/db-lease.json

      - name: Install exact production dependencies
        run: python -m pip install --disable-pip-version-check -r "$RUNTIME_DIR/requirements.txt"

      - name: Check logical-stage idempotency
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          already="$(python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('''
                      SELECT EXISTS (
                          SELECT 1
                            FROM ux_app.run_executions r
                            JOIN LATERAL (
                                SELECT lifecycle_status
                                  FROM ux_app.run_events
                                 WHERE run_execution_id = r.id
                                 ORDER BY event_seq DESC
                                 LIMIT 1
                            ) e ON true
                           WHERE r.target_date = %s::date
                             AND r.stage = %s::text
                             AND e.lifecycle_status = 'SUCCEEDED'
                      )
                  ''', (os.environ['TARGET_DATE'], os.environ['MORNING_STAGE']))
                  print('true' if cur.fetchone()[0] else 'false')
          PY
          )"
          echo "already_succeeded=$already" >> "$GITHUB_OUTPUT"

      - name: Verify LINE skip-detail DB fallback state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row

          result = {
              'schema_version': 'boatrace-line-db-fallback-verification-v2',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'read_only_verification': True,
              'notification_requeued': False,
              'latest_skip_audit_event': None,
              'trigger': None,
              'function_present': None,
              'latest_morning_digest': None,
              'query_errors': [],
              'status': 'UNKNOWN',
          }

          def one(label, sql):
              try:
                  with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row) as conn:
                      conn.execute('SET TRANSACTION READ ONLY')
                      with conn.cursor() as cur:
                          cur.execute(sql)
                          row = cur.fetchone()
                          return None if row is None else dict(row)
              except Exception as exc:
                  result['query_errors'].append({'query': label, 'error_type': type(exc).__name__})
                  return None

          result['latest_skip_audit_event'] = one('latest_skip_audit_event', '''
              SELECT
                r.id AS run_execution_id,
                r.target_date::text AS target_date,
                r.stage,
                e.event_seq,
                e.lifecycle_status,
                e.outcome,
                e.actionable_count,
                e.s_count,
                e.a_count,
                e.details->>'skip_audit_version' AS skip_audit_version,
                CASE WHEN COALESCE(e.details->>'skip_audit_count','') ~ '^\\d+$'
                     THEN (e.details->>'skip_audit_count')::integer ELSE NULL END AS skip_audit_count
              FROM ux_app.run_executions r
              JOIN LATERAL (
                SELECT x.* FROM ux_app.run_events x
                WHERE x.run_execution_id=r.id
                ORDER BY x.event_seq DESC LIMIT 1
              ) e ON true
              WHERE e.details->>'skip_audit_version'='morning-skip-audit-v1'
              ORDER BY r.id DESC LIMIT 1
          ''')

          result['function_present'] = one('function_present', '''
              SELECT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid=p.pronamespace
                WHERE n.nspname='ux_app'
                  AND p.proname='enrich_morning_digest_skip_audit_v1'
              ) AS present
          ''')

          result['trigger'] = one('trigger', '''
              SELECT t.tgenabled
              FROM pg_trigger t
              JOIN pg_class c ON c.oid=t.tgrelid
              JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='ux_app'
                AND c.relname='notification_outbox'
                AND t.tgname='morning_digest_skip_audit_enrichment'
                AND NOT t.tgisinternal
              LIMIT 1
          ''')

          result['latest_morning_digest'] = one('latest_morning_digest', '''
              SELECT
                o.id,
                o.run_execution_id,
                o.status,
                o.created_at::text AS created_at,
                o.accepted_at::text AS accepted_at,
                (o.provider_message_id IS NOT NULL) AS provider_message_id_present,
                o.payload->>'presentation' AS presentation,
                o.payload->>'ui_version' AS ui_version,
                o.payload->>'skip_audit_version' AS skip_audit_version,
                CASE WHEN jsonb_typeof(o.payload->'skip_summary_lines')='array'
                     THEN jsonb_array_length(o.payload->'skip_summary_lines') ELSE 0 END AS skip_summary_line_count,
                POSITION('見送り内訳' IN COALESCE(o.payload->>'canonical_text','')) > 0 AS canonical_has_skip_breakdown,
                POSITION('実オッズEVはこの通知では未評価' IN COALESCE(o.payload->>'canonical_text','')) > 0 AS canonical_has_ev_disclaimer
              FROM ux_app.notification_outbox o
              WHERE o.event_kind='MORNING_DIGEST'
              ORDER BY o.id DESC LIMIT 1
          ''')

          event = result['latest_skip_audit_event'] or {}
          trigger = result['trigger'] or {}
          function_present = result['function_present'] or {}
          digest = result['latest_morning_digest'] or {}
          generated = (
              event.get('skip_audit_version') == 'morning-skip-audit-v1'
              and isinstance(event.get('skip_audit_count'), int)
              and event.get('skip_audit_count', 0) > 0
          )
          enrichment_ready = bool(function_present.get('present') and trigger.get('tgenabled') in ('O', 'A'))
          delivered = bool(
              digest.get('presentation') == 'MORNING_CARD_V2'
              and digest.get('canonical_has_skip_breakdown')
              and digest.get('canonical_has_ev_disclaimer')
              and digest.get('status') in ('SENT', 'DELIVERED', 'ACCEPTED')
          )
          if delivered:
              result['status'] = 'PASS_DELIVERED'
          elif generated and enrichment_ready:
              result['status'] = 'READY_NEXT_DIGEST'
          elif generated:
              result['status'] = 'RUN_EVENT_READY_OUTBOX_UNVERIFIED'
          else:
              result['status'] = 'BLOCKED'

          Path('evidence/boatrace-line-db-fallback-verification.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Compile and execute frozen Morning production
        id: run
        shell: bash
        env:
          ALREADY_SUCCEEDED: ${{ steps.guard.outputs.already_succeeded }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/boatrace-morning-production.log"
          if [ "$ALREADY_SUCCEEDED" = true ]; then
            printf '%s\n' '{"status":"SKIPPED_ALREADY_SUCCEEDED"}' > "$log"
            code=0
            disposition=SKIPPED
          else
            python -m py_compile \
              "$RUNTIME_DIR/runner.py" \
              "$RUNTIME_DIR/production.py" \
              "$RUNTIME_DIR/run_with_digest.py"
            set +e
            (
              cd "$RUNTIME_DIR"
              python run_with_digest.py --target-date "$TARGET_DATE" --stage "$MORNING_STAGE"
            ) > "$log" 2>&1
            code=$?
            set -e
            disposition=EXECUTED
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          echo "log_path=$log" >> "$GITHUB_OUTPUT"
          tail -n 120 "$log"

      - name: Persist sanitized production evidence
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          DISPOSITION: ${{ steps.run.outputs.disposition }}
          LOG_PATH: ${{ steps.run.outputs.log_path }}
          LEASE_EXPIRES_AT: ${{ steps.lease.outputs.expires_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path(os.environ['LOG_PATH']).read_text(errors='replace')
          log = re.sub(r'postgres(?:ql)?://[^\s]+', '[REDACTED_DATABASE_URL]', log)
          code = int(os.environ['EXIT_CODE'])
          result = {
              'schema_version': 'boatrace-public-free-production-run-v2',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'target_date': os.environ['TARGET_DATE'],
              'stage': os.environ['MORNING_STAGE'],
              'exit_code': code,
              'success': code == 0,
              'disposition': os.environ['DISPOSITION'],
              'event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'event_schedule': os.environ.get('EVENT_SCHEDULE') or None,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'source_commit_sha': os.environ.get('GITHUB_SHA'),
              'lease_expires_at': os.environ.get('LEASE_EXPIRES_AT'),
              'database_secret_stored': False,
              'automatic_purchase': False,
              'log_tail': log[-6000:],
          }
          Path('ops/boatrace-morning-free/last-run.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/boatrace-morning-free/last-run.json evidence/boatrace-line-db-fallback-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record BOAT RACE Morning ${TARGET_DATE} ${MORNING_STAGE} production"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            done
            [ "$pushed" = true ]
          fi

      - name: Revoke short-lived database lease
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${DATABASE_URL:-}" ]; then
            python - <<'PY'
          import os
          import psycopg
          try:
              with psycopg.connect(os.environ['DATABASE_URL']) as conn:
                  with conn.cursor() as cur:
                      cur.execute('SELECT public.boatrace_revoke_own_db_lease()')
                      cur.fetchone()
                  conn.commit()
          except Exception as exc:
              print(f'lease revoke warning: {type(exc).__name__}')
          PY
          fi
          exit 0

      - name: Enforce production result
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          [ "$EXIT_CODE" = 0 ]

# retry after Neon caller allowlist fix: 2026-08-24
