name: BOAT RACE Morning Free

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boatrace-morning-free.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub OIDC access to Neon Data API
        shell: bash
        env:
          DATA_API_URL: https://ep-weathered-cloud-ax67iew3.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
          OIDC_AUDIENCE: neon-boatrace-morning-free
        run: |
          set -euo pipefail
          token_response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          jwt="$(jq -er '.value' <<<"$token_response")"
          response="$(curl -fsS --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H 'Content-Type: application/json' \
            "${DATA_API_URL}/rpc/boatrace_oidc_probe" \
            -d '{}')"
          jq -e '.ok == true' <<<"$response"
          jq '{ok, repository, repository_id, ref, workflow_ref, event_name, run_id, actor_id}' <<<"$response"
